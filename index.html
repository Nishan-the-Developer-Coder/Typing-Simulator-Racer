<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Typing Simulator & Racer (Collapsible)</title>
  <style>
    body {
      background-color: #f4f7f6;
      color: #333333;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      margin: 0;
      padding: 20px;
      box-sizing: border-box;
    }
    .simulator-box {
      background: #ffffff;
      padding: 30px;
      border-radius: 12px;
      box-shadow: 0 4px 20px rgba(0,0,0,0.08);
      max-width: 650px;
      width: 100%;
      box-sizing: border-box;
    }
    .controls-wrapper {
      display: flex;
      flex-direction: column;
      gap: 15px;
      margin-bottom: 20px;
      background: #f8fafc;
      padding: 16px;
      border-radius: 8px;
      border: 1px solid #e2e8f0;
    }
    .controls-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 15px;
    }
    .control-item {
      display: flex;
      align-items: center;
      gap: 10px;
    }
    label {
      font-weight: 600;
      font-size: 14px;
    }
    select, .wpm-number-input, .custom-text-box {
      padding: 8px 12px;
      font-size: 15px;
      border: 2px solid #cbd5e1;
      border-radius: 6px;
      outline: none;
      background: white;
      box-sizing: border-box;
    }
    select, .wpm-number-input {
      font-weight: bold;
      color: #007bff;
    }
    select:focus, .wpm-number-input:focus, .custom-text-box:focus {
      border-color: #007bff;
    }
    .wpm-number-input {
      width: 75px;
      text-align: center;
    }
    /* Collapsible container styling */
    .collapsible-container {
      width: 100%;
      border-top: 1px solid #e2e8f0;
      padding-top: 12px;
      margin-top: 5px;
    }
    .collapsible-container summary {
      font-weight: 600;
      font-size: 14px;
      color: #475569;
      cursor: pointer;
      user-select: none;
      outline: none;
      display: flex;
      align-items: center;
      gap: 6px;
    }
    .collapsible-container summary:hover {
      color: #007bff;
    }
    .custom-text-box {
      width: 100%;
      height: 70px;
      resize: vertical;
      font-family: inherit;
      font-size: 14px;
      color: #475569;
      margin-top: 10px;
    }
    .text-display {
      font-size: 22px;
      line-height: 1.6;
      letter-spacing: 0.5px;
      word-break: break-word;
      min-height: 120px;
      position: relative;
      margin-bottom: 20px;
    }
    .char {
      color: #d1d5db; 
      transition: color 0.08s ease, background-color 0.08s ease;
      position: relative;
    }
    .char.completed, .char.user-correct {
      color: #1f2937; 
      font-weight: 500;
    }
    .char.user-incorrect {
      color: #ef4444;
      background-color: #fee2e2;
    }
    .char.pace-marker {
      border-bottom: 2px solid #007bff;
    }
    .input-field {
      width: 100%;
      padding: 12px;
      font-size: 16px;
      border: 2px solid #cbd5e1;
      border-radius: 6px;
      box-sizing: border-box;
      outline: none;
      transition: border-color 0.2s, opacity 0.2s;
    }
    .input-field:focus {
      border-color: #007bff;
    }
    .input-field:disabled {
      background-color: #f1f5f9;
      cursor: not-allowed;
      opacity: 0.6;
    }
  </style>
</head>
<body>

  <div class="simulator-box">
    <div class="controls-wrapper">
      <div class="controls-row">
        <div class="control-item">
          <label for="mode-select">Mode:</label>
          <select id="mode-select">
            <option value="simulator">Auto Simulator</option>
            <option value="racer">Interactive Racer</option>
          </select>
        </div>
        
        <div class="control-item">
          <label for="wpm-input">Target WPM:</label>
          <input type="number" id="wpm-input" class="wpm-number-input" min="10" max="500" value="120" step="5">
        </div>
      </div>

      <!-- Native Collapsible Practice Text Module -->
      <details class="collapsible-container">
        <summary>⚙️ Custom Practice Text Options</summary>
        <textarea id="custom-text" class="custom-text-box" placeholder="Paste custom words here... (Clearing this box restores default paragraph)"></textarea>
      </details>
    </div>

    <div class="text-display" id="text-display"></div>
    <input type="text" class="input-field" id="user-input" placeholder="Switch to Racer mode to start typing..." disabled>
  </div>

  <script>
    const defaultParagraph = "Touch typing builds muscle memory so you can type faster with fewer errors. The visual simulator demonstrates how much time you save over a year.";
    let textToAnimate = defaultParagraph;

    const displayEl = document.getElementById('text-display');
    const speedInputEl = document.getElementById('wpm-input');
    const modeSelectEl = document.getElementById('mode-select');
    const customTextEl = document.getElementById('custom-text');
    const inputEl = document.getElementById('user-input');
    
    let activeInterval = null;
    let globalIndex = 0;

    function initializeTextStructure() {
      const userCustomString = customTextEl.value.trim();
      textToAnimate = userCustomString.length > 0 ? userCustomString : defaultParagraph;

      displayEl.innerHTML = '';
      textToAnimate.split('').forEach(char => {
        const span = document.createElement('span');
        span.className = 'char';
        span.innerText = char;
        displayEl.appendChild(span);
      });
      inputEl.value = '';
    }

    function startEngine() {
      clearInterval(activeInterval);
      initializeTextStructure();
      
      const currentMode = modeSelectEl.value;
      let currentWPM = parseInt(speedInputEl.value) || 120;
      
      if (currentWPM > 500) currentWPM = 500;
      if (currentWPM < 1) currentWPM = 1;

      const intervalTime = (60 * 1000) / (currentWPM * 5); 
      const charSpans = displayEl.querySelectorAll('.char');
      globalIndex = 0;

      if (currentMode === 'racer') {
        inputEl.disabled = false;
        inputEl.placeholder = "Start typing here to race the pace bar...";
        inputEl.focus();
      } else {
        inputEl.disabled = true;
        inputEl.placeholder = "Watching Auto Simulator mode...";
      }

      activeInterval = setInterval(() => {
        if (currentMode === 'simulator') {
          if (globalIndex < charSpans.length) {
            charSpans[globalIndex].classList.add('completed');
            globalIndex++;
          } else {
            clearInterval(activeInterval);
            setTimeout(startEngine, 1500); 
          }
        } else if (currentMode === 'racer') {
          charSpans.forEach(span => span.classList.remove('pace-marker'));
          if (globalIndex < charSpans.length) {
            charSpans[globalIndex].classList.add('pace-marker');
            globalIndex++;
          } else {
            clearInterval(activeInterval);
          }
        }
      }, intervalTime);
    }

    inputEl.addEventListener('input', () => {
      const typedValue = inputEl.value.split('');
      const charSpans = displayEl.querySelectorAll('.char');

      charSpans.forEach((span, index) => {
        const typedChar = typedValue[index];
        if (typedChar == null) {
          span.classList.remove('user-correct', 'user-incorrect');
        } else if (typedChar === span.innerText) {
          span.classList.add('user-correct');
          span.classList.remove('user-incorrect');
        } else {
          span.classList.add('user-incorrect');
          span.classList.remove('user-correct');
        }
      });

      if (typedValue.length >= textToAnimate.length) {
        setTimeout(startEngine, 1000);
      }
    });

    speedInputEl.addEventListener('input', startEngine);
    modeSelectEl.addEventListener('change', startEngine);
    customTextEl.addEventListener('input', startEngine);

    startEngine();
  </script>
</body>
</html>
